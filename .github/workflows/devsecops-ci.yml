name: Quantum PQC Canary CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tooling & Cryptographic Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest bandit
          pip install -r requirements.txt

      - name: Static Security Audit (Bandit SAST)
        run: |
          bandit -r src/ -ll

      - name: PEP8 Linting & Code Hygiene
        run: |
          flake8 src/ tests/ --count --ignore=W292 --max-line-length=100 --statistics

      - name: Run Hybrid KEM & Downgrade Prevention Tests
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Compile Hardened PQC Container
        run: |
          docker build -t quantum-pqc-tls-canary:latest .